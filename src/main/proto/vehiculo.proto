syntax = "proto3";

package com.unla.tp_distribuidos.grpc;

option java_multiple_files = true;
option java_package = "com.unla.tp_distribuidos.grpc";
option java_outer_classname = "VehiculoProto";

service VehiculoGrpcService {
    rpc CrearVehiculo(CrearVehiculoRequest) returns (VehiculoResponse);
    rpc ModificarVehiculo(ModificarVehiculoRequest) returns (VehiculoResponse);
    rpc BajaLogicaVehiculo(BajaLogicaVehiculoRequest) returns (BajaLogicaVehiculoResponse);
    rpc ObtenerVehiculoPorId(ObtenerVehiculoPorIdRequest) returns (VehiculoResponse);
    rpc ListarVehiculosDisponibles(ListarVehiculosDisponiblesRequest) returns (ListarVehiculosResponse);
}

message VehiculoResponse {
    int64 id = 1;
    string patente = 2;
    string marca = 3;
    string modelo = 4;
    int32 anio = 5;
    string color = 6;
    string tipo = 7;
    double precioDiario = 8;
    string estado = 9;
    bool activo = 10;
}

message CrearVehiculoRequest {
    string patente = 1;
    string marca = 2;
    string modelo = 3;
    int32 anio = 4;
    string color = 5;
    string tipo = 6;
    double precioDiario = 7;
    string estado = 8;
}

message ModificarVehiculoRequest {
    int64 id = 1;
    string marca = 2;
    string modelo = 3;
    int32 anio = 4;
    string color = 5;
    string tipo = 6;
    double precioDiario = 7;
    string estado = 8;
}

message BajaLogicaVehiculoRequest {
    int64 id = 1;
}

message BajaLogicaVehiculoResponse {
    bool exito = 1;
    string mensaje = 2;
}

message ObtenerVehiculoPorIdRequest {
    int64 id = 1;
}

message ListarVehiculosDisponiblesRequest {
}

message ListarVehiculosResponse {
    repeated VehiculoResponse vehiculos = 1;
}
