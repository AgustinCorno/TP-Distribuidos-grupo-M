syntax = "proto3";

package com.unla.tp_distribuidos.grpc.vehiculo;

option java_multiple_files = true;
option java_package = "com.unla.tp_distribuidos.grpc.vehiculo";


service VehiculoGrpcService {

  rpc CrearVehiculo (CrearVehiculoRequest) returns (VehiculoResponse);

  rpc ModificarVehiculo (ModificarVehiculoRequest) returns (VehiculoResponse);

  rpc BajaLogicaVehiculo (VehiculoIdRequest) returns (VehiculoResponse);

  rpc ObtenerVehiculoPorId (VehiculoIdRequest) returns (VehiculoResponse);

  rpc ListarVehiculosActivos (Empty) returns (VehiculosResponse);

  rpc ConsultarDisponibilidad (DisponibilidadRequest) returns (VehiculosResponse);

  rpc ActualizarEstadoVehiculo (ActualizarEstadoRequest) returns (VehiculoResponse);
}

message Empty {}

message CrearVehiculoRequest {
  string patente = 1;
  string marca = 2;
  string modelo = 3;
  int32 anio = 4;
  string color = 5;
  string tipo = 6;
  double precioDiario = 7;
  string estado = 8;        // opcional; vacío = usa DISPONIBLE por default
}

message ModificarVehiculoRequest {
  int64 id = 1;
  string marca = 2;
  string modelo = 3;
  int32 anio = 4;
  string color = 5;
  string tipo = 6;
  double precioDiario = 7;
  string estado = 8;        // opcional
}

message VehiculoIdRequest {
  int64 id = 1;
}

message DisponibilidadRequest {
  string fechaHoraInicio = 1;
  string fechaHoraFin = 2;
  string tipo = 3;
  string marca = 4;
  string modelo = 5;
  double precioMin = 6;
  double precioMax = 7;
}

message ActualizarEstadoRequest {
  int64 id = 1;
  string nuevoEstado = 2;  // ej: "DISPONIBLE", "RESERVADO", "EN_MANTENIMIENTO"
}

message VehiculoResponse {
  int64 id = 1;
  string patente = 2;
  string marca = 3;
  string modelo = 4;
  int32 anio = 5;
  string color = 6;
  string tipo = 7;
  double precioDiario = 8;
  string estado = 9;
  bool activo = 10;
}


message VehiculosResponse {
  repeated VehiculoResponse vehiculos = 1;
}